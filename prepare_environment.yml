---
- name: Require -l to scope the run
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure -l <target> was passed
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: |
          Pass -l <target> to choose which host(s) to provision.
          Available targets: local, ubuntu_test_vms, arch_test_vms, dev_vms.

- name: Prepare environment with i3-wm
  hosts: all
  tasks:
    - name: Run common prepare phase
      ansible.builtin.import_role:
        name: common
        tasks_from: prepare

    - name: Prepare Ubuntu-based environment with i3-wm
      ansible.builtin.import_role:
        name: ubuntu
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare Arch-based environment with i3-wm
      ansible.builtin.import_role:
        name: arch
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Run common finalize phase
      ansible.builtin.import_role:
        name: common
        tasks_from: finalize
