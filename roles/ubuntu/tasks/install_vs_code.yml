---
- name: Install Visual Studio Code apt prerequisites
  ansible.builtin.apt:
    name:
      - wget
      - gpg
    state: present
  become: true

- name: Add Microsoft GPG key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /usr/share/keyrings/microsoft.asc
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Add Visual Studio Code apt repository
  ansible.builtin.deb822_repository:
    name: vscode
    types: deb
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures:
      - amd64
      - arm64
      - armhf
    signed_by: /usr/share/keyrings/microsoft.asc
    state: present
  become: true

- name: Install Visual Studio Code
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true
  become: true

- name: Install Visual Studio Code extensions
  ansible.builtin.command: "code --install-extension {{ item }}"
  register: vs_code_ext
  changed_when: "'is already installed' not in vs_code_ext.stdout"
  loop:
    - redhat.ansible
    - eamodio.gitlens
    - s-nlf-fh.glassit
    - pkief.material-icon-theme
    - ms-python.vscode-pylance
    - ms-python.python
    - ms-python.debugpy
    - ms-vscode-remote.remote-ssh
    - ms-vscode-remote.remote-ssh-edit
    - ms-vscode.remote-explorer
    - ajshortt.tokyo-hack
    - redhat.vscode-yaml
    - bscan.perlnavigator
    - charliermarsh.ruff
    - batisteo.vscode-django
    - monosans.djlint
    - esbenp.prettier-vscode
