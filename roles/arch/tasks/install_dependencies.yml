---
- name: Install neccesary pacman packages
  community.general.pacman:
    name:
      - i3-wm
      - rofi
      - polybar
      - picom
      - neofetch
      - htop
      - alacritty
      - git
      - feh
      - bat
      - redshift
      - virtualbox
      - virtualbox-host-modules-arch
      - direnv
      - lxappearance
      - openvpn
      - discord
      - firefox
      - flameshot
      - arandr
      - jdk-openjdk
      - dbeaver
      - zip
      - unzip
      - dunst
      - ripgrep
      - papirus-icon-theme
      - pavucontrol
    state: present
  become: true

- name: Install neccesary AUR dependencies
  kewlfft.aur.aur:
    use: makepkg
    name:
      - google-chrome
      - burpsuite
      - openvpn-update-systemd-resolved
    update_cache: true

- name: Import tasks
  ansible.builtin.import_tasks: install_zsh.yml

- name: Import tasks
  ansible.builtin.import_tasks: install_vs_code.yml

- name: Import tasks
  ansible.builtin.import_tasks: install_vagrant.yml
